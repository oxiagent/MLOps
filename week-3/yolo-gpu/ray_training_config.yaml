# Конфігурація тренування YOLO
# Базові налаштування
model_type: "yolov8n.pt"
dataset: "coco8.yaml"
epochs: 100
batch_size: 32
img_size: 640

# Параметри тренування
optimizer: "Adam"
lr0: 0.001
warmup_epochs: 1.0
save_period: 1

# Інтеграція W&B
wandb_project: "setuniversity-mlops-s25"
run_name: "yolo-ray-training"       

# Налаштування виконання
ray_python_path: "python3" 
auto_install_deps: true  
show_ray_logs: false  
